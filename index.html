<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>3D 粒子爱心 · 浅粉</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 44%, #1e0a1b 0%, #0e0411 45%, #050208 100%);
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="app"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   0. 全局设置
   ============================================================ */
THREE.ColorManagement.enabled = false;

const app = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearAlpha(0);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  50,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

/* ============================================================
   1. 圆形柔光粒子贴图
   ============================================================ */
function createParticleTexture() {
  const s = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');

  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.20, 'rgba(255,255,255,0.85)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.32)');
  g.addColorStop(0.70, 'rgba(255,255,255,0.07)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');

  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s / 2, s / 2, s / 2, 0, Math.PI * 2);
  ctx.fill();

  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  return tex;
}

const particleTexture = createParticleTexture();

/* ============================================================
   2. 粒子着色器材质
   ============================================================ */
function createParticleMaterial(size, blending) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTex:        { value: particleTexture },
      uSize:       { value: size },
      uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
    },
    vertexShader: /* glsl */`
      attribute float aSize;
      attribute float aAlpha;
      attribute vec3  aColor;

      uniform float uSize;
      uniform float uPixelRatio;

      varying float vAlpha;
      varying vec3  vColor;

      void main() {
        vAlpha = aAlpha;
        vColor = aColor;

        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);

        float persp = clamp(40.0 / max(-mvPosition.z, 1.0), 0.55, 1.6);
        gl_PointSize = uSize * aSize * uPixelRatio * persp;

        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: /* glsl */`
      uniform sampler2D uTex;

      varying float vAlpha;
      varying vec3  vColor;

      void main() {
        float a = texture2D(uTex, gl_PointCoord).a * vAlpha;
        if (a < 0.01) discard;
        gl_FragColor = vec4(vColor, a);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: blending
  });
}

/* ============================================================
   3. 心形参数方程
   ============================================================ */
function heartCurve(t) {
  const s = Math.sin(t);
  return {
    x: 16 * s * s * s,
    y: 13 * Math.cos(t)
       - 5 * Math.cos(2 * t)
       - 2 * Math.cos(3 * t)
       - Math.cos(4 * t)
  };
}

/* ---- 全部浅粉色（由内到外只有极轻微的层次） ---- */
const COLOR_INNER = new THREE.Color(0xffe3f2); // 极浅粉（近白）
const COLOR_MID   = new THREE.Color(0xffc8e3); // 浅粉
const COLOR_OUTER = new THREE.Color(0xffaad4); // 稍亮一点的浅粉
const COLOR_WHITE = new THREE.Color(0xffffff);

/* 按归一化半径 r(0中心~1表面) 取浅粉渐变色 */
function sampleGradient(r, out) {
  const d = Math.pow(r, 0.75);
  if (d < 0.5) {
    out.copy(COLOR_INNER).lerp(COLOR_MID, d / 0.5);
  } else {
    out.copy(COLOR_MID).lerp(COLOR_OUTER, (d - 0.5) / 0.5);
  }
  return out;
}

/* ============================================================
   4. 构建爱心粒子云
   ============================================================ */
const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
const HEART_COUNT = isMobile ? 10000 : 22000;

/* 外层容器：统一把爱心整体缩小 */
const heartPivot = new THREE.Group();
heartPivot.scale.setScalar(0.65);   // ← 爱心整体变小（原来 1.0）
scene.add(heartPivot);

/* 内层：负责心跳缩放与旋转 */
const heartGroup = new THREE.Group();
heartPivot.add(heartGroup);

const heartPositions = new Float32Array(HEART_COUNT * 3);
const heartColors    = new Float32Array(HEART_COUNT * 3);
const heartSizes     = new Float32Array(HEART_COUNT);
const heartAlphas    = new Float32Array(HEART_COUNT);

const _c = new THREE.Color();

for (let i = 0; i < HEART_COUNT; i++) {
  const t = Math.random() * Math.PI * 2;
  const curve = heartCurve(t);

  // 径向系数：偏向表面，中心也留一部分
  const r = Math.pow(Math.random(), 0.55);

  // 绕 Y 轴旋转成三维
  const phi = Math.random() * Math.PI * 2;

  const rx = curve.x * r;
  const ry = (curve.y + 6) * r; // +6 让心形垂直居中

  let px = rx * Math.cos(phi);
  let pz = rx * Math.sin(phi) * 0.80; // Z 轴压扁一点，更像心
  let py = ry;

  // 轻微扰动
  px += (Math.random() - 0.5) * 0.38;
  py += (Math.random() - 0.5) * 0.38;
  pz += (Math.random() - 0.5) * 0.38;

  heartPositions[i * 3 + 0] = px;
  heartPositions[i * 3 + 1] = py;
  heartPositions[i * 3 + 2] = pz;

  // 颜色：整体浅粉
  sampleGradient(r, _c);
  heartColors[i * 3 + 0] = _c.r;
  heartColors[i * 3 + 1] = _c.g;
  heartColors[i * 3 + 2] = _c.b;

  heartSizes[i]  = 0.62 + Math.random() * 0.85;
  heartAlphas[i] = 0.40 + Math.random() * 0.55;
}

const heartGeo = new THREE.BufferGeometry();
heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPositions, 3));
heartGeo.setAttribute('aColor',   new THREE.BufferAttribute(heartColors, 3));
heartGeo.setAttribute('aSize',    new THREE.BufferAttribute(heartSizes, 1));
heartGeo.setAttribute('aAlpha',   new THREE.BufferAttribute(heartAlphas, 1));

const heartMaterial = createParticleMaterial(3.6, THREE.NormalBlending);
const heartPoints = new THREE.Points(heartGeo, heartMaterial);
heartPoints.frustumCulled = false;
heartGroup.add(heartPoints);

/* ============================================================
   5. 飘落粒子系统
   ============================================================ */
const MAX_DROPS = 900;

const dropPositions = new Float32Array(MAX_DROPS * 3);
const dropColors    = new Float32Array(MAX_DROPS * 3);
const dropSizes     = new Float32Array(MAX_DROPS);
const dropAlphas    = new Float32Array(MAX_DROPS);

const dropVel     = new Float32Array(MAX_DROPS * 3);
const dropLife    = new Float32Array(MAX_DROPS);
const dropMaxLife = new Float32Array(MAX_DROPS);

let dropCursor = 0;

const dropGeo = new THREE.BufferGeometry();
dropGeo.setAttribute('position', new THREE.BufferAttribute(dropPositions, 3));
dropGeo.setAttribute('aColor',   new THREE.BufferAttribute(dropColors, 3));
dropGeo.setAttribute('aSize',    new THREE.BufferAttribute(dropSizes, 1));
dropGeo.setAttribute('aAlpha',   new THREE.BufferAttribute(dropAlphas, 1));

const dropMaterial = createParticleMaterial(3.0, THREE.AdditiveBlending);
const dropPoints = new THREE.Points(dropGeo, dropMaterial);
dropPoints.frustumCulled = false;
scene.add(dropPoints);

const _v3 = new THREE.Vector3();

function spawnDrop() {
  const i = dropCursor;
  dropCursor = (dropCursor + 1) % MAX_DROPS;

  const t = Math.random() * Math.PI * 2;
  const curve = heartCurve(t);

  const r = 0.86 + Math.random() * 0.20;
  const phi = Math.random() * Math.PI * 2;

  const rx = curve.x * r;
  const ry = (curve.y + 6) * r;

  // 局部坐标 -> 世界坐标（包含缩放、旋转、心跳）
  _v3.set(rx * Math.cos(phi), ry, rx * Math.sin(phi) * 0.80);
  heartGroup.localToWorld(_v3);

  dropPositions[i * 3 + 0] = _v3.x;
  dropPositions[i * 3 + 1] = _v3.y;
  dropPositions[i * 3 + 2] = _v3.z;

  // 初速度：轻微外扩 + 向下
  dropVel[i * 3 + 0] = (Math.random() - 0.5) * 1.0;
  dropVel[i * 3 + 1] = -0.9 - Math.random() * 0.9;
  dropVel[i * 3 + 2] = (Math.random() - 0.5) * 1.0;

  // 颜色：浅粉再提亮
  sampleGradient(r, _c).lerp(COLOR_WHITE, 0.30);
  dropColors[i * 3 + 0] = _c.r;
  dropColors[i * 3 + 1] = _c.g;
  dropColors[i * 3 + 2] = _c.b;

  dropSizes[i] = 0.75 + Math.random() * 0.9;

  dropMaxLife[i] = 1.8 + Math.random() * 1.9;
  dropLife[i] = dropMaxLife[i];
  dropAlphas[i] = 1.0;
}

function updateDrops(dt) {
  const GRAVITY = -3.5;

  for (let i = 0; i < MAX_DROPS; i++) {
    if (dropLife[i] <= 0) {
      if (dropAlphas[i] !== 0) dropAlphas[i] = 0;
      continue;
    }

    dropLife[i] -= dt;
    if (dropLife[i] <= 0) {
      dropLife[i] = 0;
      dropAlphas[i] = 0;
      continue;
    }

    dropVel[i * 3 + 1] += GRAVITY * dt;

    dropPositions[i * 3 + 0] += dropVel[i * 3 + 0] * dt;
    dropPositions[i * 3 + 1] += dropVel[i * 3 + 1] * dt;
    dropPositions[i * 3 + 2] += dropVel[i * 3 + 2] * dt;

    const ratio = dropLife[i] / dropMaxLife[i];
    dropAlphas[i] = Math.min(1, ratio * 2.2) * 0.9;
  }

  dropGeo.attributes.position.needsUpdate = true;
  dropGeo.attributes.aColor.needsUpdate   = true;
  dropGeo.attributes.aSize.needsUpdate    = true;
  dropGeo.attributes.aAlpha.needsUpdate   = true;
}

/* ============================================================
   6. 心跳节奏（慢速、规律）
   ============================================================ */
const BEAT_PERIOD = 2.6; // 秒 / 一次完整心跳

function heartbeat(p) {
  const g = (x, mu, sigma) =>
    Math.exp(-((x - mu) * (x - mu)) / (2 * sigma * sigma));

  // 两次「咚·咚」的高斯脉冲
  return 0.85 * g(p, 0.08, 0.055) + 0.48 * g(p, 0.26, 0.070);
}

/* ============================================================
   7. 相机自适应
   ============================================================ */
function updateCamera() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const aspect = w / h;

  camera.aspect = aspect;

  const fovRad = (camera.fov * Math.PI) / 180;
  const dist = Math.max(32, 18 / (Math.tan(fovRad / 2) * aspect));

  camera.position.set(0, 0, dist);
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
}

function onResize() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  updateCamera();
}

window.addEventListener('resize', onResize);
updateCamera();

/* ============================================================
   8. 主循环
   ============================================================ */
const clock = new THREE.Clock();
let elapsed = 0;
let spawnAccumulator = 0;
const SPAWN_PER_SECOND = 70;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  /* ---- 心跳缩放 ---- */
  const phase = (elapsed % BEAT_PERIOD) / BEAT_PERIOD;
  const beat = heartbeat(phase);
  const beatScale = 1 + 0.082 * beat;
  heartGroup.scale.setScalar(beatScale);

  /* ---- 缓慢旋转 ---- */
  heartGroup.rotation.y += dt * 0.36;
  heartGroup.rotation.x = Math.sin(elapsed * 0.45) * 0.075;

  // 更新整棵父级矩阵，保证 localToWorld 使用最新变换
  heartPivot.updateMatrixWorld(true);

  /* ---- 生成飘落粒子 ---- */
  spawnAccumulator += dt * SPAWN_PER_SECOND;
  while (spawnAccumulator >= 1) {
    spawnDrop();
    spawnAccumulator -= 1;
  }

  /* ---- 更新飘落粒子 ---- */
  updateDrops(dt);

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
